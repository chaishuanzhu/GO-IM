# IM — 生产环境 nginx 反向代理（SSL 终止）
#
# 架构：Internet → proxy (SSL) → gateway（API + WebSocket）
#
# 使用前将所有的 ${DOMAIN} 替换为你的域名。

server {
    listen       80;
    server_name  ${DOMAIN};

    # ------------------------------------------------------------------
    # Let's Encrypt HTTP-01 验证
    # ------------------------------------------------------------------
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ------------------------------------------------------------------
    # 所有 HTTP 流量重定向到 HTTPS
    # ------------------------------------------------------------------
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------
# www 子域 → 裸域名 301 跳转(80 端口同时保留 HTTP-01 验证)
# ------------------------------------------------------------------
server {
    listen       80;
    server_name  www.${DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://${DOMAIN}$request_uri;
    }
}

server {
    listen       443 ssl http2;
    server_name  www.${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    # 所有 www HTTPS 流量 301 到裸域名
    return 301 https://${DOMAIN}$request_uri;
}

server {
    listen       443 ssl http2;
    server_name  ${DOMAIN};

    # ------------------------------------------------------------------
    # SSL 证书（由 certbot 管理）
    # ------------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    # ------------------------------------------------------------------
    # SSL 安全配置（Mozilla 现代兼容性）
    # ------------------------------------------------------------------
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # 安全头
    add_header X-Frame-Options           DENY            always;
    add_header X-Content-Type-Options    nosniff         always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ------------------------------------------------------------------
    # 代理到 gateway（HTTP API + WebSocket）
    # ------------------------------------------------------------------
    location / {
        proxy_pass          http://gateway:8080;
        proxy_http_version  1.1;
        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   $scheme;

        # WebSocket 升级
        proxy_set_header    Upgrade             $http_upgrade;
        proxy_set_header    Connection          $connection_upgrade;

        # 超时设置（WebSocket 长连接 + 大文件上传）
        proxy_read_timeout   3600s;
        proxy_send_timeout   3600s;
    }

    # 客户端最大上传体积（与服务端 legacy_max_upload 对齐，直传走 oss 子域）
    client_max_body_size 20m;
}

# ------------------------------------------------------------------
# 对象存储入口 oss.${DOMAIN} → RustFS（客户端预签名直传/下载）
# object_storage.public_endpoint 须为 https://oss.${DOMAIN}；
# CORS 由 RustFS 桶策略（cors_allowed_origins）返回，nginx 不再添加。
# ------------------------------------------------------------------
server {
    listen       80;
    server_name  oss.${DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen       443 ssl http2;
    server_name  oss.${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 略大于 object_storage.max_upload（100 MB）
    client_max_body_size 110m;

    location / {
        proxy_pass          http://rustfs:9000;
        proxy_http_version  1.1;
        # 预签名按 oss.${DOMAIN} 计算，Host 必须原样透传
        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   $scheme;
        proxy_request_buffering off;
        proxy_buffering         off;
        proxy_read_timeout   600s;
        proxy_send_timeout   600s;
    }
}

# ------------------------------------------------------------------
# WebSocket 升级头穿透映射
# ------------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
