apiVersion: v1
kind: Service
metadata:
  name: logic
spec:
  selector:
    app: logic
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logic
spec:
  replicas: 1
  # 滚动更新：新 Pod 就绪后再停旧 Pod；新旧并存期间各自从 Redis 租用不同的 snowflake worker ID，
  # Kafka 消费组自动重平衡。
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 5
  selector:
    matchLabels:
      app: logic
  template:
    metadata:
      labels:
        app: logic
    spec:
      terminationGracePeriodSeconds: 45
      initContainers:
        - name: wait-deps
          image: busybox:1.37
          command:
            - sh
            - -c
            - for d in mysql:3306 redis:6379 kafka:9093; do until nc -z -w 2 ${d%:*} ${d#*:}; do echo "waiting for $d"; sleep 2; done; done
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { cpu: 100m, memory: 32Mi }
      containers:
        - name: logic
          image: 870027381/go-im-logic
          env:
            - { name: CONFIG_PATH, value: /etc/im/config.json }
            - { name: TZ, value: Asia/Shanghai }
          lifecycle:
            # 先等 Service 摘掉本 Pod 再 GracefulStop（GOAWAY 后网关的 gRPC 连接重连到新 Pod）
            preStop:
              exec:
                command: ["sleep", "5"]
          ports:
            - name: grpc
              containerPort: 50051
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
          volumeMounts:
            - name: config
              mountPath: /etc/im
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: goim-config
