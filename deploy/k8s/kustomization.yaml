# GO-IM — Kubernetes 全量部署
#   kubectl apply -k deploy/k8s
# 说明见 deploy/README.md。上线前至少修改：
#   - config.json 的 jwt.secret
#   - 下方 goim-infra 的密码（同步改 config.json 里的 MySQL DSN / object_storage.secret_key）
#   - 邮箱验证码：config.json 的 gateway.mail，SMTP 密码填在下方 MAIL_PASSWORD
#   - ingress.yaml 的域名和 ingressClassName
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: go-im

resources:
  - namespace.yaml
  - mysql.yaml
  - redis.yaml
  - kafka.yaml
  - rustfs.yaml
  - logic.yaml
  - gateway.yaml
  - ingress.yaml

# 名字带内容哈希，修改后 apply 会自动滚动重启引用它的 Pod。
secretGenerator:
  - name: goim-config
    files:
      - config.json
  - name: goim-infra
    literals:
      - MYSQL_ROOT_PASSWORD=im-root
      - MYSQL_PASSWORD=im-dev
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
      - MAIL_PASSWORD=

images:
  - name: 870027381/go-im-gateway
    newTag: "1.6.0"
  - name: 870027381/go-im-logic
    newTag: "1.6.0"
