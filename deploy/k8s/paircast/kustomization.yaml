# Paircast（一起看）业务服务 —— 可选叠加层，在主部署之后应用：
#   kubectl apply -k deploy/k8s
#   kubectl apply -k deploy/k8s/paircast
#   kubectl -n go-im rollout restart deployment/gateway   # 让网关读到 goim-paircast 里的接入方密钥
# 应用后 Ingress 把 /media、/room 转到 paircast；不应用时网关内置的兼容实现（gateway.media，已弃用）继续提供这两组接口。
# 上线前修改：
#   - 下方 IM_SECRET / IM_WEBHOOK_SECRET（网关与 paircast 共用同一个 Secret）
#   - paircast.json 的 media.sources，以及下方 MEDIA_* 密钥
#   - ingress.yaml 的域名（与主 ingress 相同）
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: go-im

resources:
  - paircast.yaml
  - ingress.yaml

secretGenerator:
  - name: goim-paircast-config
    files:
      - paircast.json
  # 网关也引用它，名字不能带内容哈希；修改后需手动重启 gateway 与 paircast。
  - name: goim-paircast
    options:
      disableNameSuffixHash: true
    literals:
      - IM_SECRET=change-me-paircast-secret
      - IM_WEBHOOK_SECRET=change-me-paircast-webhook-secret
      - MYSQL_DSN=im:im-dev@tcp(mysql:3306)/im?parseTime=true&charset=utf8mb4
      - MEDIA_OSS_ACCESS_KEY=
      - MEDIA_OSS_SECRET_KEY=
      - BLOB_ACCESS_KEY=rustfsadmin
      - BLOB_SECRET_KEY=rustfsadmin
      - TMDB_ACCESS_TOKEN=
      - OPENSUBTITLES_API_KEY=

images:
  - name: 870027381/go-im-paircast
    newTag: "1.7.0"
