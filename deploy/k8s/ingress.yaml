# 主域名全部直达 Gateway（API、/ws 长连接、/upload 大请求体）；oss 子域直达 RustFS。
# nginx.ingress.kubernetes.io/* 注解只对 ingress-nginx 生效，其它控制器会忽略。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: go-im
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  # ingressClassName: nginx   # 或 traefik；不填则用集群默认 IngressClass
  # tls:
  #   - hosts: [im.example.com]
  #     secretName: go-im-tls
  rules:
    - host: im.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: gateway, port: { name: http } }
---
# 文件直传入口：客户端用预签名 URL 直接 PUT/GET RustFS。
# 启用时把 config.json 的 object_storage.public_endpoint 设为 https://oss.example.com，
# 原生客户端不受 CORS 限制，cors_allowed_origins 可留空。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: go-im-oss
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 110m
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  # ingressClassName: nginx
  # tls:
  #   - hosts: [oss.example.com]
  #     secretName: go-im-oss-tls
  rules:
    - host: oss.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: rustfs, port: { name: s3 } }
