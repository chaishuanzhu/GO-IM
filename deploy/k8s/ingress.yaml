# /ws 和 /upload 直达 Gateway（长连接、大请求体），其余经 web 容器的 nginx；oss 子域直达 RustFS。
# nginx.ingress.kubernetes.io/* 注解只对 ingress-nginx 生效，其它控制器会忽略。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: go-im
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  # ingressClassName: nginx   # 或 traefik；不填则用集群默认 IngressClass
  # tls:
  #   - hosts: [im.example.com]
  #     secretName: go-im-tls
  rules:
    - host: im.example.com
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service: { name: gateway, port: { name: http } }
          - path: /upload
            pathType: Prefix
            backend:
              service: { name: gateway, port: { name: http } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { name: http } }
---
# 文件直传入口：客户端用预签名 URL 直接 PUT/GET RustFS。
# 启用时把 config.json 的 object_storage.public_endpoint 设为 https://oss.example.com，
# cors_allowed_origins 设为 Web 站点来源（如 https://im.example.com）。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: go-im-oss
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 110m
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  # ingressClassName: nginx
  # tls:
  #   - hosts: [oss.example.com]
  #     secretName: go-im-oss-tls
  rules:
    - host: oss.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: rustfs, port: { name: s3 } }
