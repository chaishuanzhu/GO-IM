# GO-IM — Docker 全量部署（Docker Hub 预构建镜像）
# MySQL + Redis + Kafka + RustFS + Logic + Gateway；说明见 deploy/README.md
#
#   mkdir go-im && cd go-im
#   curl -fsSLO https://raw.githubusercontent.com/chaishuanzhu/GO-IM/main/deploy/docker/docker-compose.yml
#   curl -fsSLO https://raw.githubusercontent.com/chaishuanzhu/GO-IM/main/deploy/docker/config.json
#   docker compose up -d
#
# 客户端服务器地址填 http://<服务器IP>:${HTTP_PORT:-8080}（公网建议前面加 HTTPS 反向代理）
#
# 可选环境变量 (写进同目录 .env 即可):
#   GOIM_TAG   镜像版本,默认 latest,生产建议固定为具体版本 (如 1.3.0)
#   HTTP_PORT  Gateway HTTP / WebSocket 端口,默认 8080
#   MYSQL_PASSWORD / RUSTFS_SECRET_KEY  改了这两个需同步修改 config.json

name: go-im

x-restart: &restart
  restart: unless-stopped

services:
  redis:
    <<: *restart
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mysql:
    <<: *restart
    image: mysql:8.4
    command: --mysql-native-password=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-im-root}
      MYSQL_DATABASE: im
      MYSQL_USER: im
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-im-dev}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    <<: *restart
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9093,CONTROLLER://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9093", "--list"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s

  # S3 兼容对象存储，存放图片和文件。
  rustfs:
    <<: *restart
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
    # 文件直传入口：由反向代理/CDN 把 OSS 域名转发到这里（Host 原样透传），
    # 并在 config.json 设置 object_storage.public_endpoint；默认只监听本机。
    ports:
      - "${OSS_BIND:-127.0.0.1}:${OSS_PORT:-9000}:9000"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  logic:
    <<: *restart
    image: 870027381/go-im-logic:${GOIM_TAG:-latest}
    volumes:
      - ./config.json:/etc/im/config.json:ro
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }

  gateway:
    <<: *restart
    image: 870027381/go-im-gateway:${GOIM_TAG:-latest}
    environment:
      GOIM_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    ports:
      - "${HTTP_PORT:-8080}:8080"  # HTTP API + WebSocket
      - "${TCP_PORT:-8081}:8081"   # 原生 TCP 长连接 (移动端/桌面端可选)
    volumes:
      - ./config.json:/etc/im/config.json:ro
    depends_on:
      redis: { condition: service_healthy }
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }
      rustfs: { condition: service_healthy }
      logic: { condition: service_started }

volumes:
  redis-data:
  mysql-data:
  kafka-data:
  rustfs-data:
