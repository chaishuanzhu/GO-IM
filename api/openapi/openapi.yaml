openapi: 3.0.3
info:
  title: GO-IM Gateway HTTP API
  version: "1.3.0"
  description: |
    Gateway 的 HTTP 接口。实时消息走 WebSocket（`/ws`）或 gnet TCP，帧为 Protobuf `Message`，见 `docs/07-api-reference.md`。

    **认证**：先 `POST /login` 拿到 `uid` 与 `token`，点右上角 **Authorize** 填入两项后，其余接口会自动带上
    `?uid=…&token=…`。服务端从查询参数或表单读取这两个值（POST 时也可以放在表单里）；`uid` 必须与 token 中的用户一致，否则返回 403。

    **约定**：
    - POST 请求体为 `application/x-www-form-urlencoded`（`/upload` 为 `multipart/form-data`）。
    - 时间戳均为 Unix 毫秒。
    - 错误响应为纯文本（`text/plain`），内容是简短的英文原因。
servers:
  - url: /
tags:
  - name: 账号
    description: 登录、注册、验证码、密码
  - name: 用户
    description: 资料、头像、用户搜索、在线状态
  - name: 好友
  - name: 群组
  - name: 文件
    description: 上传（直传对象存储或经网关中转）与下载
  - name: 消息
    description: 全文搜索、未读数、实时连接
  - name: 系统
  - name: 管理
    description: 需要管理员角色（`role=admin`）

security:
  - uid: []
    token: []

paths:
  /login:
    post:
      tags: [账号]
      summary: 登录
      description: |
        `account` 为用户 ID 或邮箱（含 `@` 按邮箱查找）。开发模式（`auth.dev_mode`）下可以不带密码，
        直接以 `account` 作为 UID 登录，并可用 `nickname` 指定昵称、`role=admin` 获得管理员角色。
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [account]
              properties:
                account:
                  type: string
                  description: 用户 ID 或邮箱；兼容旧字段 `uid` / `username`
                  example: alice@example.com
                password:
                  type: string
                  format: password
                  description: 生产模式必填
                nickname:
                  type: string
                  description: 仅开发模式免密登录时使用
                role:
                  type: string
                  enum: [admin]
                  description: 仅开发模式有效
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "`password required` 或 `invalid account or password`"
          content: { text/plain: { schema: { type: string } } }
        "403":
          description: "`account disabled`"
          content: { text/plain: { schema: { type: string } } }
        "503": { $ref: "#/components/responses/Unavailable" }

  /auth/email-code:
    post:
      tags: [账号]
      summary: 发送邮箱验证码
      description: |
        验证码 6 位数字，10 分钟有效，最多尝试 5 次。同一邮箱 60 秒内只能发送一次、每天最多 10 次，同一 IP 每小时最多 20 次。
        `purpose=bind_email` 时需要登录（带 `uid` + `token`）。未配置邮件时，开发模式只把验证码打印到网关日志，生产模式返回 503。
      security:
        - {}
        - uid: []
          token: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email, purpose]
              properties:
                email: { type: string, format: email }
                purpose:
                  type: string
                  enum: [register, reset_password, bind_email]
      responses:
        "200":
          description: 已发送
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  expires_in: { type: integer, description: 有效期（秒）, example: 600 }
                  retry_after: { type: integer, description: 再次发送前需等待的秒数, example: 60 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: "`email not registered`（找回密码时邮箱未注册）"
          content: { text/plain: { schema: { type: string } } }
        "409":
          description: "`email already registered`（注册 / 绑定时邮箱已被使用）"
          content: { text/plain: { schema: { type: string } } }
        "429":
          description: 发送太频繁；冷却期内 `Retry-After` 头给出需等待的秒数
          headers:
            Retry-After: { schema: { type: integer } }
          content: { text/plain: { schema: { type: string } } }
        "502":
          description: "`failed to send email`"
          content: { text/plain: { schema: { type: string } } }
        "503": { $ref: "#/components/responses/Unavailable" }

  /register:
    post:
      tags: [账号]
      summary: 邮箱注册
      description: 需要 MySQL。用户 ID 由服务端从 100000 起分配；不传昵称时取邮箱 `@` 前的部分。成功后直接返回登录结果。
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email, code, password]
              properties:
                email: { type: string, format: email }
                code: { type: string, description: "`purpose=register` 的验证码", example: "123456" }
                password: { type: string, format: password, minLength: 6, maxLength: 72 }
                nickname: { type: string, maxLength: 32 }
      responses:
        "200":
          description: 注册成功（同登录响应）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400":
          description: 参数无效，或 `invalid or expired verification code`
          content: { text/plain: { schema: { type: string } } }
        "409":
          description: "`email already registered`"
          content: { text/plain: { schema: { type: string } } }
        "503": { $ref: "#/components/responses/Unavailable" }

  /password/reset:
    post:
      tags: [账号]
      summary: 通过邮箱验证码重置密码
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email, code, new_password]
              properties:
                email: { type: string, format: email }
                code: { type: string, description: "`purpose=reset_password` 的验证码" }
                new_password: { type: string, format: password, minLength: 6, maxLength: 72 }
      responses:
        "200":
          description: 已重置
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  uid: { type: string, example: "100001" }
        "400":
          description: 参数无效，或 `invalid or expired verification code`
          content: { text/plain: { schema: { type: string } } }
        "404":
          description: "`email not registered`"
          content: { text/plain: { schema: { type: string } } }
        "503": { $ref: "#/components/responses/Unavailable" }

  /change-password:
    post:
      tags: [账号]
      summary: 修改密码
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password: { type: string, format: password }
                new_password: { type: string, format: password, minLength: 6 }
      responses:
        "200":
          description: 已修改
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusOK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: 未登录，或 `invalid current password`
          content: { text/plain: { schema: { type: string } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /user/profile:
    get:
      tags: [用户]
      summary: 读取资料
      description: 不带 `target`（或 `target` 为自己）时返回自己的完整资料；否则返回对方的公开资料。
      parameters:
        - name: target
          in: query
          schema: { type: string }
          description: 要查看的用户 ID
      responses:
        "200":
          description: 资料
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OwnProfile"
                  - $ref: "#/components/schemas/PublicProfile"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      tags: [用户]
      summary: 修改昵称 / 头像
      description: 两个字段至少带一个。头像须是自己上传、已就绪的图片；设为头像后可通过 `/avatar/{file_id}` 公开读取。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                nickname: { type: string, minLength: 1, maxLength: 32 }
                avatar_file_id:
                  type: string
                  description: "`/upload` 或直传得到的 `file_id`；`0` 清除头像"
      responses:
        "200":
          description: 修改后的完整资料
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnProfile" }
        "400":
          description: "`nothing to update`、昵称无效、`avatar file not found`、`avatar must be an image` 等"
          content: { text/plain: { schema: { type: string } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /user/profiles:
    get:
      tags: [用户]
      summary: 批量读取公开资料
      description: 不存在的用户不出现在结果中。
      parameters:
        - name: uids
          in: query
          required: true
          description: 逗号分隔的用户 ID，最多 200 个
          schema: { type: string, example: "100001,100002" }
      responses:
        "200":
          description: 公开资料列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        "400":
          description: "`too many uids`"
          content: { text/plain: { schema: { type: string } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /user/search:
    get:
      tags: [用户]
      summary: 搜索用户
      description: 按昵称包含匹配，或按邮箱、用户 ID 精确匹配；结果不含邮箱。`q` 为空时返回空列表。
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 64 }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
      responses:
        "200":
          description: 匹配的用户
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        "400":
          description: "`query too long`"
          content: { text/plain: { schema: { type: string } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /user/email:
    post:
      tags: [用户]
      summary: 绑定 / 更换邮箱
      description: 绑定后可用邮箱登录和找回密码。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string, description: "`purpose=bind_email` 的验证码" }
      responses:
        "200":
          description: 绑定后的完整资料
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnProfile" }
        "400":
          description: 邮箱无效，或 `invalid or expired verification code`
          content: { text/plain: { schema: { type: string } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`email already registered`"
          content: { text/plain: { schema: { type: string } } }
        "503": { $ref: "#/components/responses/Unavailable" }

  /avatar/{file_id}:
    get:
      tags: [用户]
      summary: 头像图片
      description: "无需登录，只能读取已被设为头像的文件。响应带 `Cache-Control: public, max-age=31536000, immutable`，换头像会产生新的 URL。"
      security: []
      parameters:
        - name: file_id
          in: path
          required: true
          schema: { type: string }
        - name: thumb
          in: query
          description: "`1` 返回 200px 缩略图（没有缩略图时返回原图）"
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: 图片数据
          content:
            image/*:
              schema: { type: string, format: binary }
        "304":
          description: "`If-None-Match` 命中"
        "404": { $ref: "#/components/responses/NotFound" }

  /online:
    get:
      tags: [用户]
      summary: 在线用户
      security: []
      responses:
        "200":
          description: 当前网关上的在线用户
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer, example: 2 }
                  users:
                    type: array
                    items: { type: string }
                    example: ["100001", "100002"]

  /friend/list:
    get:
      tags: [好友]
      summary: 好友列表与待处理请求
      responses:
        "200":
          description: 好友与收到的待处理请求
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid: { type: string }
                  friends:
                    type: array
                    items: { $ref: "#/components/schemas/Friend" }
                  pending_requests:
                    type: array
                    items: { $ref: "#/components/schemas/FriendRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /friend/request:
    post:
      tags: [好友]
      summary: 发送好友请求
      description: 对方在线时会实时收到通知。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [to_uid]
              properties:
                to_uid: { type: string }
      responses:
        "200":
          description: 已发送
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusOK" }
        "400":
          description: "`to_uid required` 或 `cannot friend yourself`"
          content: { text/plain: { schema: { type: string } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: 已是好友或已存在请求
          content: { text/plain: { schema: { type: string } } }
        "503": { $ref: "#/components/responses/Unavailable" }

  /friend/accept:
    post:
      tags: [好友]
      summary: 接受好友请求
      requestBody: { $ref: "#/components/requestBodies/FromUID" }
      responses:
        "200":
          description: 已接受
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusOK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: 没有该请求
          content: { text/plain: { schema: { type: string } } }
        "503": { $ref: "#/components/responses/Unavailable" }

  /friend/reject:
    post:
      tags: [好友]
      summary: 拒绝好友请求
      requestBody: { $ref: "#/components/requestBodies/FromUID" }
      responses:
        "200":
          description: 已拒绝
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusOK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: 没有该请求
          content: { text/plain: { schema: { type: string } } }
        "503": { $ref: "#/components/responses/Unavailable" }

  /friend/remove:
    post:
      tags: [好友]
      summary: 删除好友
      description: 双向解除，对方在线时会收到通知；聊天记录保留。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [friend_uid]
              properties:
                friend_uid: { type: string }
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusOK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: 不是好友
          content: { text/plain: { schema: { type: string } } }
        "503": { $ref: "#/components/responses/Unavailable" }

  /group/list:
    get:
      tags: [群组]
      summary: 我加入的群
      responses:
        "200":
          description: 群列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items: { $ref: "#/components/schemas/GroupSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /group/members:
    get:
      tags: [群组]
      summary: 群成员
      parameters:
        - name: group_id
          in: query
          required: true
          schema: { type: string, example: g_337501598508912641 }
      responses:
        "200":
          description: 成员 UID 列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  group_id: { type: string }
                  members:
                    type: array
                    items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /group/create:
    post:
      tags: [群组]
      summary: 创建群
      description: 创建者成为群主；`members` 中的用户直接入群并收到 `member_joined` 通知。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: Dev Team }
                members:
                  type: string
                  description: 逗号分隔的初始成员 UID
                  example: "100002,100003"
      responses:
        "200":
          description: 新群
          content:
            application/json:
              schema:
                type: object
                properties:
                  group_id: { type: string }
                  name: { type: string }
                  owner_uid: { type: string }
                  members:
                    type: array
                    items: { type: string }
                  created_at: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /group/join:
    post:
      tags: [群组]
      summary: 加入群
      requestBody: { $ref: "#/components/requestBodies/GroupID" }
      responses:
        "200": { $ref: "#/components/responses/OKTrue" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`already a member`"
          content: { text/plain: { schema: { type: string } } }
        "503": { $ref: "#/components/responses/Unavailable" }

  /group/leave:
    post:
      tags: [群组]
      summary: 退出群
      description: 最后一名成员退出时群被删除。
      requestBody: { $ref: "#/components/requestBodies/GroupID" }
      responses:
        "200": { $ref: "#/components/responses/OKTrue" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`not a member`"
          content: { text/plain: { schema: { type: string } } }
        "503": { $ref: "#/components/responses/Unavailable" }

  /group/invite:
    post:
      tags: [群组]
      summary: 邀请成员（仅群主）
      requestBody: { $ref: "#/components/requestBodies/GroupTarget" }
      responses:
        "200": { $ref: "#/components/responses/OKTrue" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: uid 与 token 不匹配，或不是群主
          content: { text/plain: { schema: { type: string } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`user is already a member`"
          content: { text/plain: { schema: { type: string } } }
        "503": { $ref: "#/components/responses/Unavailable" }

  /group/kick:
    post:
      tags: [群组]
      summary: 移除成员（仅群主）
      requestBody: { $ref: "#/components/requestBodies/GroupTarget" }
      responses:
        "200": { $ref: "#/components/responses/OKTrue" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: uid 与 token 不匹配，或不是群主
          content: { text/plain: { schema: { type: string } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`target user is not a member`"
          content: { text/plain: { schema: { type: string } } }
        "503": { $ref: "#/components/responses/Unavailable" }

  /group/rename:
    post:
      tags: [群组]
      summary: 修改群名（仅群主）
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [group_id, name]
              properties:
                group_id: { type: string }
                name: { type: string }
      responses:
        "200":
          description: 已修改
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: string, example: "true" }
                  name: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: uid 与 token 不匹配，或不是群主
          content: { text/plain: { schema: { type: string } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /group/transfer:
    post:
      tags: [群组]
      summary: 转让群主（仅群主）
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [group_id, to_uid]
              properties:
                group_id: { type: string }
                to_uid: { type: string, description: 新群主，必须是群成员 }
      responses:
        "200":
          description: 已转让
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: string, example: "true" }
                  owner_uid: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: uid 与 token 不匹配，或不是群主
          content: { text/plain: { schema: { type: string } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 新群主不是成员
          content: { text/plain: { schema: { type: string } } }
        "503": { $ref: "#/components/responses/Unavailable" }

  /file/presign:
    post:
      tags: [文件]
      summary: 申请直传 URL
      description: |
        直传流程：presign → 客户端用 `method` 请求 `upload_url`（原样带上 `headers`，body 为文件原始字节）→ `POST /file/complete`。
        `Content-Type` 与 `Content-Length`（须等于申请的 `size`）参与签名。URL 默认 15 分钟有效，24 小时内未 complete 的文件会被清理。
        服务端未配置 `object_storage.public_endpoint` 时返回 501，客户端应回退到 `POST /upload`。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [size]
              properties:
                size: { type: integer, format: int64, minimum: 1, description: 文件字节数 }
                name: { type: string, description: 文件名，默认 `file` }
                mime:
                  type: string
                  description: 可执行类型（`text/html`、`image/svg+xml`、JavaScript 等）统一改为 `application/octet-stream`
      responses:
        "200":
          description: 预签名上传信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  file_id: { type: string }
                  upload_url: { type: string, format: uri }
                  method: { type: string, example: PUT }
                  headers:
                    type: object
                    additionalProperties: { type: string }
                    example: { Content-Type: image/jpeg }
                  expires_at: { type: integer, format: int64 }
                  max_size: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413":
          description: "`file too large`"
          content: { text/plain: { schema: { type: string } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "501":
          description: "`direct upload not enabled`"
          content: { text/plain: { schema: { type: string } } }

  /file/complete:
    post:
      tags: [文件]
      summary: 确认直传完成
      description: |
        服务端核对对象大小、嗅探文件头（声明为图片但内容不是图片时类型降级为 `application/octet-stream`），
        并对 ≤ 20 MB、≤ 4096px 的图片异步生成缩略图（生成前 `thumb_width` / `thumb_height` 为 0）。重复调用幂等。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [file_id]
              properties:
                file_id: { type: string }
                width: { type: integer, description: 客户端已知的图片宽度，服务端无法从文件头解析时采用 }
                height: { type: integer }
      responses:
        "200":
          description: 文件元数据
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileMeta" }
        "400":
          description: "`invalid file_id`，或已上传大小与申请的 `size` 不一致（记录被删除，需重新 presign）"
          content: { text/plain: { schema: { type: string } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`object not uploaded`"
          content: { text/plain: { schema: { type: string } } }
        "501":
          description: "`direct upload not enabled`"
          content: { text/plain: { schema: { type: string } } }

  /upload:
    post:
      tags: [文件]
      summary: 经网关上传文件
      description: 兼容路径，大小受 `object_storage.max_upload` 限制。图片同步生成 200px 缩略图（超过 4096px 不生成）。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: 文件元数据
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileMeta" }
        "400":
          description: 缺少 uid / token / file，或文件为空
          content: { text/plain: { schema: { type: string } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413":
          description: 文件过大
          content: { text/plain: { schema: { type: string } } }
        "503": { $ref: "#/components/responses/Unavailable" }

  /file:
    get:
      tags: [文件]
      summary: 下载文件 / 缩略图
      description: |
        仅上传者与文件被发送到的会话成员可读；直传上线前上传的文件（无文件记录）登录即可读。
        开启直传时返回 302 到对象存储的预签名地址，否则直接返回文件数据并支持 `Range`。缩略图不存在时返回原文件。
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
        - name: thumb
          in: query
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: 文件数据
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: Range 部分内容
        "302":
          description: 跳转到预签名下载地址
          headers:
            Location: { schema: { type: string, format: uri } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: 文件不存在、未完成上传或无权访问
          content: { text/plain: { schema: { type: string } } }
        "503": { $ref: "#/components/responses/Unavailable" }

  /search:
    get:
      tags: [消息]
      summary: 全文搜索消息
      description: 仅返回搜索者参与的消息。`next_cursor` 为 0 表示没有更多结果，否则作为下一页的 `cursor`。
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: peer, in: query, description: 限定与某人或某群的会话, schema: { type: string } }
        - { name: chat_type, in: query, description: 1 单聊，2 群聊, schema: { type: integer, enum: [1, 2] } }
        - name: msg_type
          in: query
          description: 1 文本，2 图片，3 语音，4 视频，5 文件，6 表情包
          schema: { type: integer, enum: [1, 2, 3, 4, 5, 6] }
        - { name: before, in: query, description: 时间戳上限（毫秒）, schema: { type: integer, format: int64 } }
        - { name: after, in: query, description: 时间戳下限（毫秒）, schema: { type: integer, format: int64 } }
        - { name: cursor, in: query, description: 上一页的 `next_cursor`, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        "200":
          description: 搜索结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  query: { type: string }
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
                  total: { type: integer, description: 本页条数 }
                  next_cursor: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /unread:
    get:
      tags: [消息]
      summary: 未读计数
      responses:
        "200":
          description: 按会话对方（UID 或群 ID）统计的未读条数
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid: { type: string }
                  counts:
                    type: object
                    additionalProperties: { type: integer, format: int64 }
                    example: { "100002": 3, g_337501598508912641: 1 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /ws:
    get:
      tags: [消息]
      summary: WebSocket 实时连接
      description: |
        升级为 WebSocket，帧为二进制 Protobuf `Message`，Swagger UI 无法直接调用。连接成功后服务端先发 `CmdLoginResp`（cmd=4）。
        仅在 `gateway.transport` 为 `websocket` 或 `both` 时提供。
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "101":
          description: 协议升级成功
        "401": { $ref: "#/components/responses/Unauthorized" }

  /health:
    get:
      tags: [系统]
      summary: 健康检查
      security: []
      responses:
        "200":
          description: 有依赖不健康时 `status` 为 `degraded`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /metrics:
    get:
      tags: [系统]
      summary: Prometheus 指标
      description: "`stability.metrics_enabled` 为 true 时提供。"
      security: []
      responses:
        "200":
          description: Prometheus 文本格式
          content:
            text/plain:
              schema: { type: string }

  /admin/stats:
    get:
      tags: [管理]
      summary: 系统统计
      responses:
        "200":
          description: 统计汇总
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Health"
                  - type: object
                    properties:
                      online_users: { type: integer }
                      total_users: { type: integer }
                      total_messages: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminRequired" }

  /admin/users:
    get:
      tags: [管理]
      summary: 用户列表
      parameters:
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: 分页用户
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/AdminUser" }
                  total: { type: integer }
                  offset: { type: integer }
                  limit: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminRequired" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /admin/users/delete:
    post:
      tags: [管理]
      summary: 删除用户
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [target_uid]
              properties:
                target_uid: { type: string }
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusOK" }
        "400":
          description: "`target_uid required` 或 `cannot delete yourself`"
          content: { text/plain: { schema: { type: string } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminRequired" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /admin/messages:
    get:
      tags: [管理]
      summary: 最近消息（内容审核）
      parameters:
        - { name: before, in: query, description: 时间戳上限（毫秒）, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 100 } }
      responses:
        "200":
          description: 消息列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
                  limit: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminRequired" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /admin/messages/delete:
    post:
      tags: [管理]
      summary: 删除消息
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [msg_id]
              properties:
                msg_id: { type: string, description: Snowflake 消息 ID }
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusOK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminRequired" }
        "503": { $ref: "#/components/responses/Unavailable" }

components:
  securitySchemes:
    uid:
      type: apiKey
      in: query
      name: uid
      description: 登录返回的 `uid`
    token:
      type: apiKey
      in: query
      name: token
      description: 登录返回的 JWT `token`

  requestBodies:
    GroupID:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required: [group_id]
            properties:
              group_id: { type: string, example: g_337501598508912641 }
    GroupTarget:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required: [group_id, target_uid]
            properties:
              group_id: { type: string }
              target_uid: { type: string }
    FromUID:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required: [from_uid]
            properties:
              from_uid: { type: string, description: 请求方 UID }

  responses:
    OKTrue:
      description: 成功
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: string, example: "true" }
    BadRequest:
      description: 参数缺失或无效
      content: { text/plain: { schema: { type: string } } }
    Unauthorized:
      description: 缺少 uid / token，或 token 无效、过期
      content: { text/plain: { schema: { type: string } } }
    Forbidden:
      description: "`uid does not match token`"
      content: { text/plain: { schema: { type: string } } }
    AdminRequired:
      description: uid 与 token 不匹配，或 `admin access required`
      content: { text/plain: { schema: { type: string } } }
    NotFound:
      description: 资源不存在
      content: { text/plain: { schema: { type: string } } }
    TooManyRequests:
      description: "`rate limited`"
      content: { text/plain: { schema: { type: string } } }
    Unavailable:
      description: 依赖未启用或不可用（MySQL、对象存储、邮件等）
      content: { text/plain: { schema: { type: string } } }

  schemas:
    StatusOK:
      type: object
      properties:
        status: { type: string, example: ok }

    LoginResponse:
      type: object
      properties:
        uid: { type: string, example: "100001" }
        nickname: { type: string, example: alice }
        username: { type: string, description: 同 nickname，为旧客户端保留 }
        email: { type: string, description: 未绑定时为空串 }
        avatar_url: { type: string, description: 相对网关的路径，未设置头像时为空串, example: /avatar/337501598508912642 }
        role: { type: string, enum: [user, admin] }
        token: { type: string, description: JWT，默认 7 天有效 }

    PublicProfile:
      type: object
      properties:
        uid: { type: string }
        nickname: { type: string }
        avatar_url: { type: string }

    OwnProfile:
      allOf:
        - $ref: "#/components/schemas/PublicProfile"
        - type: object
          properties:
            email: { type: string }
            role: { type: string, enum: [user, admin] }
            created_at: { type: integer, format: int64 }

    UserList:
      type: object
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/PublicProfile" }

    Friend:
      type: object
      properties:
        uid: { type: string }
        friend_uid: { type: string }
        status: { type: integer, description: 0 待处理，1 已接受，2 已拒绝 }
        created_at: { type: integer, format: int64 }
        nickname: { type: string }
        avatar_url: { type: string }

    FriendRequest:
      type: object
      properties:
        from_uid: { type: string }
        nickname: { type: string }
        created_at: { type: integer, format: int64 }
        avatar_url: { type: string }

    GroupSummary:
      type: object
      properties:
        id: { type: string, example: g_337501598508912641 }
        name: { type: string }
        owner_uid: { type: string }
        member_count: { type: integer }
        created_at: { type: integer, format: int64 }

    FileMeta:
      type: object
      properties:
        file_id: { type: string }
        name: { type: string }
        size: { type: integer, format: int64 }
        mime: { type: string }
        width: { type: integer }
        height: { type: integer }
        thumb_width: { type: integer }
        thumb_height: { type: integer }

    Message:
      type: object
      description: Protobuf `Message` 的 JSON 形式；零值字段省略
      properties:
        seq: { type: integer, format: int64 }
        msg_id: { type: integer, format: int64 }
        cmd: { type: integer }
        from: { type: string }
        to: { type: string }
        chat_type: { type: integer, description: 1 单聊，2 群聊 }
        msg_type: { type: integer, description: 1 文本，2 图片，3 语音，4 视频，5 文件，6 表情包 }
        content: { type: string, description: 文本，或文件 / 表情包等的 JSON 字符串 }
        timestamp: { type: integer, format: int64 }
        need_ack: { type: boolean }

    AdminUser:
      type: object
      properties:
        uid: { type: string }
        nickname: { type: string }
        email: { type: string }
        role: { type: string }
        is_disabled: { type: boolean }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }

    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        connections: { type: integer }
        dependencies:
          type: object
          additionalProperties: { type: string }
          example: { mysql: ok, redis: ok, minio: ok }
        memory:
          type: object
          properties:
            alloc_mb: { type: integer }
            goroutines: { type: integer }
