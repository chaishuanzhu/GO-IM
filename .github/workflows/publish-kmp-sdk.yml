# Publish fat sdk-lite + sdk-full only (internal modules embedded) to GitHub Packages.
name: publish-kmp-sdk

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override goim.sdk.version (leave empty to use gradle.properties)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kmp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Publish fat sdk-lite / sdk-full
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PUBLISH_TASKS=(
            :sdk:lite:publishKotlinMultiplatformPublicationToGitHubPackagesRepository
            :sdk:lite:publishAndroidReleasePublicationToGitHubPackagesRepository
            :sdk:lite:publishDesktopPublicationToGitHubPackagesRepository
            :sdk:full:publishKotlinMultiplatformPublicationToGitHubPackagesRepository
            :sdk:full:publishAndroidReleasePublicationToGitHubPackagesRepository
            :sdk:full:publishDesktopPublicationToGitHubPackagesRepository
          )
          if [ -n "${{ inputs.version }}" ]; then
            ./gradlew -Pgoim.sdk.version="${{ inputs.version }}" "${PUBLISH_TASKS[@]}" \
              --no-configuration-cache --stacktrace
          else
            ./gradlew "${PUBLISH_TASKS[@]}" --no-configuration-cache --stacktrace
          fi
