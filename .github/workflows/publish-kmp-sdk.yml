# Publish KMP SDK (lite/full + transitive libs) to GitHub Packages.
# Publishes kotlinMultiplatform + android + desktop (JVM). iOS target artifacts
# need a macOS runner; add a follow-up job when XCFramework Maven publish is required.
name: publish-kmp-sdk

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override goim.sdk.version (leave empty to use gradle.properties)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kmp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=(
            publishKotlinMultiplatformPublicationToGitHubPackagesRepository
            publishAndroidReleasePublicationToGitHubPackagesRepository
            publishDesktopPublicationToGitHubPackagesRepository
            --no-configuration-cache
            --stacktrace
          )
          if [ -n "${{ inputs.version }}" ]; then
            ./gradlew -Pgoim.sdk.version="${{ inputs.version }}" "${ARGS[@]}"
          else
            ./gradlew "${ARGS[@]}"
          fi
