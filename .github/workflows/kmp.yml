# KMP 客户端流水线(kmp/)
#
#   check   Linux: ./gradlew check(Android + Desktop 编译、单测、Android Lint;iOS 目标在 Linux 自动跳过)
#   ios     macOS: iOS 模拟器单测(含与 Go 服务端的 protobuf 黄金字节测试)+ Shared.framework 链接

name: KMP

on:
  push:
    branches: [main]
    paths:
      - "kmp/**"
      - "api/proto/message.proto"
      - ".github/workflows/kmp.yml"
  pull_request:
    paths:
      - "kmp/**"
      - "api/proto/message.proto"
      - ".github/workflows/kmp.yml"

concurrency:
  group: kmp-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: kmp

jobs:
  check:
    name: Check · Android + Desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: ./gradlew check
        run: ./gradlew check --console=plain

  ios:
    name: iOS · 模拟器单测 + framework
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('kmp/gradle/libs.versions.toml') }}

      - name: iOS 单测 + 链接 Shared.framework
        run: ./gradlew :data:proto:iosSimulatorArm64Test :app:shared:linkDebugFrameworkIosSimulatorArm64 --console=plain
